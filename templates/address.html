  <body>

    <h2 class="address-info" style="background-color: white; padding-top: 40px; padding-bottom: 15px;">
      Enter an address to find buses nearby.
    </h2>
    
    <div id="searchBar">
      <form id="addressForm">
        <input type="text" id="addressInput" placeholder="Enter address..." />
        <button type="submit">Search</button>
      </form>
    </div>
    
    <div id="results"></div>
    
    <div>
      <h3>Below this is where all the specific addresses will populate. I'll give them buttons so it can pull up specific bus stops on the map based on the inputted address.</h3>
    </div>
    
    <div id="map" style="height: 400px;"></div>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
      const map = L.map('map').setView([21.442843, -157.963486], 10);
      let marker = null;
      let stopMarkers = [];
      let markers = {};  // for buses

      const busIcon = L.icon({
        iconUrl: "/static/88ddb2f3138e79ff0ad212f5a6e14e23.png",  
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -32]
      });

      // Add OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Update buses moving on map
      function updateMap() {
        $.getJSON('/arrivals', function(data) {
          data.arrivals.forEach(arrival => {
            let lat = parseFloat(arrival.latitude);
            let lon = parseFloat(arrival.longitude);
            let vehicle = arrival.vehicle;

            if (!markers[vehicle]) {
              let marker = L.marker([lat, lon], {icon: busIcon}).addTo(map)
                .bindPopup(`Vehicle: ${vehicle}`);
              markers[vehicle] = marker;
            } else {
              markers[vehicle].setLatLng([lat, lon]);
            }
          });
        });
      }

      // Search address
      document.getElementById('addressForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const address = document.getElementById('addressInput').value.trim();
        if (!address) {
          alert('Please enter an address.');
          return;
        }

        try {
          // 1. Geocode the address
          const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
          const data = await response.json();
          if (data.length === 0) {
            throw new Error('No location found.');
          }

          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          console.log('Coordinates:', lat, lon);

          // 2. Move map and marker
          map.setView([lat, lon], 14);

          if (marker) {
            marker.setLatLng([lat, lon]);
          } else {
            marker = L.marker([lat, lon]).addTo(map);
          }

          // 3. Fetch nearby bus stops
          const busResponse = await fetch(`/routes?lat=${lat}&lng=${lon}`);
          const busData = await busResponse.json();

          const resultsDiv = document.getElementById('results');
          resultsDiv.innerHTML = '';  // clear previous results

          if (busData.length === 0) {
            resultsDiv.innerHTML = '<p>No bus routes found near this address.</p>';
            return;
          }

          busData.forEach(route => {
            const routeElement = document.createElement('div');
            routeElement.innerHTML = `
              <h3>${route.routeName}</h3>
              <p>Arrival Time: ${route.arrivalTime}</p>
              <button onclick="focusOnBusStop(${route.stopLat}, ${route.stopLng})">Show Stop</button>
            `;
            resultsDiv.appendChild(routeElement);
          });

        } catch (error) {
          console.error('Error:', error);
          document.getElementById('results').innerHTML = '<p>Something went wrong.</p>';
        }
      });

      // Focus on bus stop
      function focusOnBusStop(lat, lng) {
        stopMarkers.forEach(m => map.removeLayer(m));
        stopMarkers = [];

        const stopMarker = L.marker([lat, lng], {icon: busIcon}).addTo(map);
        stopMarkers.push(stopMarker);

        map.setView([lat, lng], 17);
      }


          
      async function getGeoResponse(){
      const geoResponse = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(address)}&key=${GOOGLE_MAPS_API_KEY}`);
      const geoData = await geoResponse.json();

      console.log('Raw geocode response:', geoData); // 👈 NEW

      if (geoData.status !== "OK" || geoData.results.length === 0) {
        throw new Error('No location found.');
      }
      }
  </script>
