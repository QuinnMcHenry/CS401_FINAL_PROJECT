  <script>
    function handleSearch(event) {

          if (input) {

        }

  let savedLat = null;
  let savedLng = null;

  async function getCoordinates() {
    const address = document.getElementById("searchBar").value;
    const apiKey = "AIzaSyAiN7CWd2xhXCz9u3ddAlZO_mKE3y-TfKk";

    try {
      const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(address)}&key=${apiKey}`);
      const data = await response.json();

      if (data.status === "OK") {
        const location = data.results[0].geometry.location;

        // Save to variables
        savedLat = location.lat;
        savedLng = location.lng;

        document.getElementById("output").innerText = `Lat: ${savedLat}, Lng: ${savedLng}`;
        console.log("Saved coordinates:", savedLat, savedLng); // Use this wherever later
      } else {
        document.getElementById("output").innerText = "Address not found!";
      }
    } catch (error) {
      console.error("Geocoding error:", error);
      document.getElementById("output").innerText = "Something went wrong!";
    }
  }
  const GOOGLE_MAPS_API_KEY = "AIzaSyAiN7CWd2xhXCz9u3ddAlZO_mKE3y-TfKk"; 

document.getElementById('addressForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const address = document.getElementById('addressInput').value;

  try {
    // 1. Fetch lat/lng from Google Maps Geocoding API
    const geoResponse = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(address)}&key=${GOOGLE_MAPS_API_KEY}`);
    const geoData = await geoResponse.json();

    if (geoData.status !== "OK" || geoData.results.length === 0) {
      throw new Error('No location found.');
    }

    const location = geoData.results[0].geometry.location; // { lat: ..., lng: ... }
    console.log('Coordinates:', location.lat, location.lng);

    // 2. Now you have lat and lng — you can call your own API with them
    const busResponse = await fetch(`/your-bus-api-endpoint?lat=${location.lat}&lng=${location.lng}`);
    const busData = await busResponse.json();

    // 3. Display results
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';

    if (busData.length === 0) {
      resultsDiv.innerHTML = '<p>No bus routes found near this address.</p>';
      return;
    }

    busData.forEach(route => {
      const routeElement = document.createElement('div');
      routeElement.innerHTML = `
        <h3>${route.routeName}</h3>
        <p>Arrival Time: ${route.arrivalTime}</p>
      `;
      resultsDiv.appendChild(routeElement);
    });

  } catch (error) {
    console.error('Error:', error);
    document.getElementById('results').innerHTML = '<p>Something went wrong.</p>';
  }
});
  </script>
